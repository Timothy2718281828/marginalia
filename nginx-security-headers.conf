# Security headers for marginmath.cc
# Add this inside your server { } block in /etc/nginx/sites-available/marginmath.cc
# Then run: sudo nginx -t && sudo systemctl reload nginx

# Content Security Policy — restricts what the browser is allowed to load/execute
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://giscus.app; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-src https://giscus.app; connect-src https://api.github.com; font-src 'self'; manifest-src 'self'" always;

# Force HTTPS for 1 year (include subdomains)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Control Referer information sent to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable client-side caching of HTML (so content updates are visible quickly)
# Static assets (JS/CSS/images) are hashed by Astro and can be cached aggressively
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
